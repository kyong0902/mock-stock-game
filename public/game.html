<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>모의주식투자 - 거래</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="app-header">
  <div class="brand">😊 <span id="nicknameLabel">-</span>님</div>
  <div class="stats-row">
    <div class="stat-pill"><span class="label">현금</span><span class="value" id="cashValue">-</span></div>
    <div class="stat-pill"><span class="label">총자산</span><span class="value" id="totalAssetsValue">-</span></div>
  </div>
  <div class="stats-row">
    <div class="stat-pill" id="tradingStatusPill"><span class="label">거래</span><span class="value" id="tradingStatusValue">-</span></div>
    <div class="stat-pill" id="timerPill" style="display:none"><span class="label">남은 시간</span><span class="value" id="remainingTimeValue">-</span></div>
  </div>
</div>

<div id="tutorialOverlay" class="tutorial-overlay" style="display:none">
  <div class="tutorial-card">
    <div class="tutorial-step-label" id="tutorialStepLabel">1 / 5</div>
    <div id="tutorialBody"></div>
    <div class="tutorial-actions">
      <button class="btn-secondary" id="tutorialPrevBtn">이전</button>
      <button class="btn-primary" id="tutorialNextBtn">다음</button>
    </div>
  </div>
</div>

<div class="page-shell">
  <div class="fixed-controls">
    <div class="panel trade-box" id="tradeBar">
      <div class="mini-label">내 보유 종목 <span class="mini-hint">(탭하면 바로 매매)</span></div>
      <div class="holdings-chips" id="holdingsChips">
        <span class="holding-empty">보유 종목 없음</span>
      </div>

      <h3 id="selectedStockName">종목을 선택하세요</h3>
      <div class="trade-summary" id="selectedStockInfo"></div>
      <div class="qty-row">
        <input type="number" id="qtyInput" min="1" value="1" />
        <span style="align-self:center; color:#9aa4b8">주</span>
      </div>
      <div class="error-msg" id="tradeError"></div>
      <div class="actions">
        <button class="btn-buy" id="buyBtn" disabled>매수</button>
        <button class="btn-sell" id="sellBtn" disabled>매도</button>
      </div>
    </div>
  </div>

  <div class="scroll-area" id="scrollArea">
    <div id="holdingModal" class="modal-overlay" style="display:none">
      <div class="modal-box" id="modalBox">
        <span class="modal-tag" id="modalTag"></span>
        <h3 id="modalTitle">📢 뉴스 속보</h3>
        <p id="modalMessage"></p>
        <div class="modal-detail" id="modalDetail"></div>
        <button class="btn-primary" id="modalCloseBtn" style="width:100%">확인</button>
      </div>
    </div>

    <div class="sector-tabs" id="sectorTabs"></div>
    <div class="stock-list" id="stockList"></div>

    <div class="panel">
      <h3>실시간 순위</h3>
      <ul class="leaderboard-list" id="leaderboardList"></ul>
    </div>

    <footer class="hint" id="pageFooter">모의 투자입니다. 실제 돈이나 실제 기업과 무관합니다.</footer>
  </div>
</div>

<script src="/js/game.js"></script>
</body>
</html>
